[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bruh"
version = "0.1.0"
description = "Because your terminal clearly isn't going to explain itself."
readme = "README.md"
authors = [
    { name = "Bruh Community" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = [
    "cli",
    "developer-tools",
    "error-explanation",
    "terminal",
    "shell",
    "diagnostics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/Wilfred2668/BRUH"
Repository = "https://github.com/Wilfred2668/BRUH"
Issues = "https://github.com/Wilfred2668/BRUH/issues"

[project.scripts]
bruh = "bruh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bruh.shell" = ["scripts/*.ps1", "scripts/*.bash", "scripts/*.zsh"]
